<svg width="1440" height="520" viewBox="0 0 1440 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Paper-WorkFlow — empirical research, orchestrated</title>
  <desc id="desc">A dark research workflow banner connecting idea, design, evidence, manuscript, and submission.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1360" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090E1A"/>
      <stop offset="0.52" stop-color="#11152B"/>
      <stop offset="1" stop-color="#071A22"/>
    </linearGradient>
    <linearGradient id="line" x1="128" y1="0" x2="1308" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="mark" x1="1100" y1="105" x2="1322" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1210 224) rotate(90) scale(205)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B7CFA" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5B7CFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="986" y="0" width="448" height="448" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1440" height="520" rx="32" fill="url(#bg)"/>
  <g opacity="0.16">
    <path d="M0 104H1440M0 208H1440M0 312H1440M0 416H1440" stroke="#A5B4FC"/>
    <path d="M120 0V520M240 0V520M360 0V520M480 0V520M600 0V520M720 0V520M840 0V520M960 0V520M1080 0V520M1200 0V520M1320 0V520" stroke="#A5B4FC"/>
  </g>
  <path d="M0 410C248 330 379 475 620 406C866 336 1008 412 1440 302V520H0V410Z" fill="#111B36" fill-opacity="0.72"/>
  <circle cx="1210" cy="224" r="182" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(92 72)">
      <rect width="174" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="20" cy="17" r="5" fill="#2DD4BF"/>
      <text x="36" y="22" fill="#C7D2FE" font-size="13" font-weight="700" letter-spacing="2.2">RESEARCH OS</text>
    </g>

    <text x="92" y="182" fill="#F8FAFC" font-size="72" font-weight="760" letter-spacing="-3.2">Paper—WorkFlow</text>
    <text x="95" y="229" fill="#A5B4FC" font-size="22" font-weight="600" letter-spacing="3.6">EMPIRICAL RESEARCH, ORCHESTRATED</text>
    <text x="94" y="276" fill="#94A3B8" font-size="19">From a research question to an auditable submission package.</text>

    <g transform="translate(94 340)">
      <path d="M20 20H822" stroke="url(#line)" stroke-width="3"/>
      <g fill="#0B1020" stroke-width="3">
        <circle cx="20" cy="20" r="10" stroke="#A78BFA"/>
        <circle cx="220" cy="20" r="10" stroke="#8B8CF8"/>
        <circle cx="420" cy="20" r="10" stroke="#647CF5"/>
        <circle cx="620" cy="20" r="10" stroke="#48A6D8"/>
        <circle cx="822" cy="20" r="10" stroke="#2DD4BF"/>
      </g>
      <g fill="#E2E8F0" font-size="13" font-weight="700" letter-spacing="1.4">
        <text x="0" y="58">01  IDEA</text>
        <text x="190" y="58">02  DESIGN</text>
        <text x="381" y="58">03  EVIDENCE</text>
        <text x="570" y="58">04  MANUSCRIPT</text>
        <text x="778" y="58">05  SUBMIT</text>
      </g>
    </g>

    <g transform="translate(1080 96)" filter="url(#shadow)">
      <circle cx="126" cy="126" r="112" fill="#0D1328" stroke="url(#mark)" stroke-width="2"/>
      <circle cx="126" cy="126" r="88" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <path d="M62 76H103C130 76 147 89 147 111C147 135 129 149 101 149H84V182H62V76ZM84 96V130H100C116 130 125 124 125 113C125 102 117 96 100 96H84Z" fill="url(#mark)"/>
      <path d="M153 76H176L191 147L211 98H229L249 147L264 76H287L261 182H240L220 132L200 182H179L153 76Z" fill="#F8FAFC" transform="translate(-28 0)"/>
      <circle cx="126" cy="15" r="4" fill="#A78BFA"/>
      <circle cx="237" cy="126" r="4" fill="#2DD4BF"/>
      <circle cx="126" cy="237" r="4" fill="#647CF5"/>
      <circle cx="15" cy="126" r="4" fill="#8B5CF6"/>
    </g>
  </g>

  <g transform="translate(94 462)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="170" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <text x="85" y="20" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1">10 STAGES</text>
    <rect x="184" width="170" height="30" rx="15" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.45"/>
    <text x="269" y="20" text-anchor="middle" fill="#A5B4FC" font-size="12" font-weight="700" letter-spacing="1">2 HARD GATES</text>
    <rect x="368" width="190" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity="0.42"/>
    <text x="463" y="20" text-anchor="middle" fill="#99F6E4" font-size="12" font-weight="700" letter-spacing="1">3 BACKENDS</text>
  </g>
</svg>
