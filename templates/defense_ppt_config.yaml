  - title: "异质性：按所有制"
    key: "国企 0.052 vs 民企 0.105"
    result: "民企效应是国企的 2 倍，反映市场化机制更强"
  - title: "机制分析：交易成本"
    key: "中介效应占比 32%"
    result: "政策通过降低区域交易成本显著提升企业 TFP"

# === 8. 稳健性检验（3-5 条） ===
robustness:
  - 替代被解释变量：OP 法、WRDG 法结果一致（0.075 / 0.081）
  - 排除直辖市：北京/上海/天津/重庆样本后效应仍为 0.072
  - 排除政策重叠期：剔除智慧城市试点企业后效应为 0.083
  - 安慰剂检验：随机置换处理时点 500 次，全部 0.07 附近
  - Bootstrap 1000 次置信区间 [0.041, 0.115]

# === 9. 机制分析与异质性（2-4 条） ===
mechanism:
  - 中介机制一：交易成本（地理距离、跨区交易频次）
  - 中介机制二：创新投入（专利申请数、R&D 强度）
  - 异质性：民企 > 国企；高人力资本 > 低人力资本
  - 异质性：竞争性行业 > 垄断性行业

# === 10. 研究贡献（3-5 条） ===
contributions:
  - 理论贡献：把 Acemoglu-Restrepo 任务模型从国家层面拓展至企业层面
  - 方法贡献：用交错 DID 替代传统 TWFE 处理政策时点不同步问题
  - 数据贡献：首次合并 CSMAR + 北大数字金融指数 + 国信中心数字经济指数
  - 政策贡献：为企业数字化转型与政府数字经济政策提供企业层面证据

# === 11. 研究局限（2-3 条） ===
limitations:
  - 数字经济政策仍处于试点期，外推至全国需谨慎
  - 仅识别 A 股上市公司，未覆盖中小微企业
  - 机制识别依赖中介变量可观测性，部分机制可能遗漏
