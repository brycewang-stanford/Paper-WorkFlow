    key: "ATT = 0.078 (SE = 0.019)，p < 0.001"
    result: "数字经济政策使处理组企业 TFP 提升约 7.8%，统计显著"
  - title: "平行趋势检验"
    key: "事件研究 leads 均接近 0"
