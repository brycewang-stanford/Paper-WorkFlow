# === 1. 选题背景（3-5 条要点） ===
background:
  - 数字经济规模占 GDP 比重突破 40%，但企业层面的生产率影响缺乏严格因果识别
  - 现有研究多以省级或行业层面数据为主，难以识别微观企业机制
  - 政策制定者需要基于企业层面证据评估数字化转型的实际经济效果

# === 2. 研究意义（2-4 条） ===
significance:
  - 理论意义：在 Acemoglu-Restrepo 框架下补充企业层面的自动化—生产率非线性关系
  - 方法意义：使用交错 DID 解决数字经济政策时点不同步的识别问题
  - 现实意义：为企业数字化转型决策与政府数字经济政策提供实证依据

# === 3. 文献综述（4-6 条） ===
literature:
  - 数字经济测度：国家信息中心 / 北大数字金融指数 / 企业数字化转型词频法
  - 全要素生产率测度：OP / LP / ACF / WRDG
  - 数字经济与企业生产率：Brynjolfsson 等信息技术—生产率悖论
  - 国内文献：赵剑波（2020）、黄群慧（2020）等
  - 现有研究缺口：多使用省级面板或截面，难以识别微观因果

# === 4. 理论分析与研究假设（3-5 条） ===
theory_hypotheses:
  - 理论框架：Acemoglu-Restrepo 任务模型 + 企业异质性生产函数
  - H1：数字经济政策显著提升企业全要素生产率
  - H2：效应在人力资本密集型企业中更显著
  - H3：效应通过降低交易成本与促进创新两条机制实现

# === 5. 数据描述（短文，2-4 段） ===
data_description: |
  本文使用 2010-2022 年中国 A 股上市公司数据，合并 CSMAR 公司财务数据与
  北大数字金融指数（省级层面）以及国家信息中心数字经济指数（城市层面），
  样本量 28,500 个企业-年度观测。处理变量为各企业所在城市被列入
  "国家数字经济创新发展试验区"的时点。控制变量包括企业规模、年龄、
  杠杆率、所有制、行业竞争度等。所有连续变量在 1% 和 99% 缩尾。

# === 6. 识别策略（短文） ===
identification: |
  采用 Callaway-Sant'Anna (2021) 交错 DID 估计量。处理时点为各城市
  入选"国家数字经济创新发展试验区"的年份。控制组为同年度未入选城市的
  企业。平行趋势检验通过事件研究系数显示。异质处理效应通过 cohort
  × period 矩阵聚合，并按企业所有制和行业分组检验。

# === 7. 主要发现（每项含 title / key / result） ===
# 自动从 03_analysis/results/main_results.json 提取；这里手填示例
main_findings:
